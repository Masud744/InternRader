<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | InternRadar</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { overflow: auto !important; height: auto !important; min-height: 100vh; display: flex; flex-direction: column; }
    .auth-container { max-width: 420px; margin: 40px auto; padding: 2rem; width: 100%; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 2rem; box-shadow: var(--shadow); }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h1 { font-size: 1.8rem; color: var(--text); font-family: var(--font-mono); letter-spacing: 0.05em; }
    .auth-header p { color: var(--text-muted); margin-top: 0.5rem; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.75rem; color: var(--primary); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem; font-family: var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 4px; background: rgba(0, 0, 0, 0.2); color: var(--text); font-size: 0.95rem; font-family: var(--font-ui); }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
    .form-group select option { background: var(--card); }
    .btn-full { width: 100%; padding: 0.8rem; font-size: 0.9rem; font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; background: var(--primary); color: var(--text); border: 1px solid var(--border-light); border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    .btn-full:hover { background: var(--primary-h); }
    .btn-full:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem; }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .alert { padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; border: 1px solid; }
    .alert-error { background: rgba(192, 57, 43, 0.15); color: #e74c3c; border-color: rgba(192, 57, 43, 0.3); }
    .alert-success { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border-color: rgba(46, 204, 113, 0.3); }
    .alert-info { background: rgba(74, 158, 202, 0.15); color: #4a9eca; border-color: rgba(74, 158, 202, 0.3); }
    .password-hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.4rem; }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent); text-decoration: none; font-size: 0.85rem; font-family: var(--font-mono); }
    .back-link:hover { text-decoration: underline; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <p class="eyebrow">InternRadar</p>
        <h1>Create Account</h1>
        <p>Sign up to start tracking internships</p>
      </div>
      
      <div id="alertBox"></div>
      
      <form id="signupForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Create a strong password" minlength="6">
          <p class="password-hint">Must be at least 6 characters</p>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
        </div>

        <div class="form-group">
          <label for="interestArea">Primary Interest Area</label>
          <select id="interestArea" name="interestArea" required>
            <option value="" disabled selected>Select your area of interest</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
            <option value="Data Science & Analytics">Data Science & Analytics</option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Web Development">Web Development</option>
            <option value="Mobile Development">Mobile Development</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Cloud Computing">Cloud Computing</option>
            <option value="Product Management">Product Management</option>
            <option value="Design (UI/UX)">Design (UI/UX)</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="experienceLevel">Experience Level</label>
          <select id="experienceLevel" name="experienceLevel" required>
            <option value="" disabled selected>Select your experience</option>
            <option value="Beginner (0-1 Years)">Beginner (0-1 Years)</option>
            <option value="Intermediate (1-3 Years)">Intermediate (1-3 Years)</option>
            <option value="Advanced (3+ Years)">Advanced (3+ Years)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="university">University / Institution</label>
          <input type="text" id="university" name="university" placeholder="E.g. University of Dhaka">
        </div>

        
        <button type="submit" class="btn-full" id="submitBtn">Create Account</button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="supabase-lib.js"></script>
  <script src="supabase.js"></script>
  <script>
    const form = document.getElementById("signupForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");
    
    function showAlert(message, type = "info") {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }
    
    function checkAuthAndLoad() {
      const checkAuth = setInterval(() => {
        if (window.auth) {
          clearInterval(checkAuth);
          showAlert("Ready! You can sign up now.", "success");
        }
      }, 500);
      
      setTimeout(() => {
        clearInterval(checkAuth);
        if (!window.auth) {
          showAlert("Auth failed to load. Open browser console (F12) for details.", "error");
        }
      }, 5000);
    }
    
    checkAuthAndLoad();
    
    async function upsertProfile(user) {
      if (!window.supabaseClient || !user) {
        return;
      }

      const payload = {
        id: user.id,
        email: user.email,
        full_name: document.getElementById("fullName").value.trim(),
        interest_area: document.getElementById("interestArea").value,
        experience_level: document.getElementById("experienceLevel").value,
        university: document.getElementById("university").value.trim(),
        updated_at: new Date().toISOString()
      };

      const { error } = await window.supabaseClient
        .from("profiles")
        .upsert(payload, { onConflict: "id" });

      if (error) {
        console.warn("[InternRadar] Profile upsert failed:", error.message);
      } else {
        console.log("[InternRadar] Profile created for:", user.email);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      if (!window.auth) {
        showAlert("Auth not loaded yet. Please wait or refresh.", "error");
        return;
      }
      
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      
      if (password !== confirmPassword) {
        showAlert("Passwords do not match", "error");
        return;
      }
      
      if (password.length < 6) {
        showAlert("Password must be at least 6 characters", "error");
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";
      
      try {
        const data = await window.auth.signUp(email, password);
        
        // If user is auto-confirmed, create profile immediately
        const user = data?.user;
        if (user && user.email_confirmed_at) {
          await upsertProfile(user);
        }
        
        showAlert("Account created! Check your email to verify your account.", "success");
        form.reset();
      } catch (error) {
        console.error("[InternRadar] Signup error:", error);
        showAlert(error.message, "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>

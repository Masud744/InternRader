<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | InternRadar</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-container { max-width: 420px; margin: 80px auto; padding: 2rem; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: var(--shadow); }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h1 { font-size: 1.8rem; background: linear-gradient(135deg, var(--primary-light), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-header p { color: var(--text-muted); margin-top: 0.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 10px; background: rgba(15, 10, 26, 0.6); color: var(--text); font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2); }
    .btn-full { width: 100%; padding: 1rem; font-size: 1rem; }
    .auth-footer { text-align: center; margin-top: 1.5rem; color: var(--text-muted); }
    .auth-footer a { color: var(--primary-light); text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .alert { padding: 1rem; border-radius: 10px; margin-bottom: 1rem; text-align: center; }
    .alert-error { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
    .alert-success { background: rgba(34, 211, 238, 0.2); color: var(--accent); border: 1px solid rgba(34, 211, 238, 0.3); }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary-light); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <a href="login.html" class="back-link">← Back to login</a>
      
      <div class="auth-header">
        <p class="eyebrow">InternRadar</p>
        <h1>Reset Password</h1>
        <p>Enter your email and we'll send you a reset link</p>
      </div>
      
      <div id="alertBox"></div>
      
      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        
        <button type="submit" class="btn-full" id="submitBtn">Send Reset Link</button>
      </form>
      
      <div class="auth-footer">
        Remember your password? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="supabase-lib.js"></script>
  <script src="supabase.js"></script>
  <script>
    const form = document.getElementById("forgotForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");
    
    function showAlert(message, type = "error") {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }
    
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const email = document.getElementById("email").value.trim();
      
      if (!email) {
        showAlert("Please enter your email address");
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      
      try {
        await auth.resetPassword(email);
        showAlert("Password reset link sent! Check your email for instructions.", "success");
        form.reset();
      } catch (error) {
        showAlert(error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | InternRadar</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { overflow: auto !important; height: auto !important; min-height: 100vh; display: flex; flex-direction: column; }
    .auth-container { max-width: 420px; margin: 40px auto; padding: 2rem; width: 100%; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 2rem; box-shadow: var(--shadow); }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h1 { font-size: 1.8rem; color: var(--text); font-family: var(--font-mono); letter-spacing: 0.05em; }
    .auth-header p { color: var(--text-muted); margin-top: 0.5rem; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.75rem; color: var(--primary); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; color: var(--text-muted); font-size: 0.85rem; font-family: var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 4px; background: rgba(0, 0, 0, 0.2); color: var(--text); font-size: 0.95rem; font-family: var(--font-ui); }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
    .form-group select option { background: var(--card); }
    .btn-full { width: 100%; padding: 0.8rem; font-size: 0.9rem; font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; background: var(--primary); color: var(--text); border: 1px solid var(--border-light); border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    .btn-full:hover { background: var(--primary-h); }
    .btn-full:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem; }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .alert { padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; border: 1px solid; }
    .alert-error { background: rgba(192, 57, 43, 0.15); color: #e74c3c; border-color: rgba(192, 57, 43, 0.3); }
    .alert-success { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border-color: rgba(46, 204, 113, 0.3); }
    .alert-info { background: rgba(74, 158, 202, 0.15); color: #4a9eca; border-color: rgba(74, 158, 202, 0.3); }
    .password-hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.4rem; }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent); text-decoration: none; font-size: 0.85rem; font-family: var(--font-mono); }
    .back-link:hover { text-decoration: underline; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <p class="eyebrow">InternRadar</p>
        <h1>Set New Password</h1>
        <p>Enter your new password below</p>
      </div>
      
      <div id="alertBox"></div>
      
      <div id="resetFormContainer">
        <form id="resetForm">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="newPassword" required placeholder="Enter new password" minlength="6">
            <p class="password-hint">Must be at least 6 characters</p>
          </div>
          
          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm new password">
          </div>
          
          <button type="submit" class="btn-full" id="submitBtn">Update Password</button>
        </form>
      </div>
      
      <div id="successMessage" class="hidden">
        <div class="alert alert-success">
          Password updated successfully! Redirecting to login...
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="supabase-lib.js"></script>
  <script src="supabase.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");
    const resetFormContainer = document.getElementById("resetFormContainer");
    const successMessage = document.getElementById("successMessage");
    
    function showAlert(message, type = "error") {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }
    
    async function checkResetToken() {
      try {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get("access_token");
        const type = hashParams.get("type");
        
        if (!accessToken && type !== "recovery") {
          const session = await auth.getSession();
          if (!session) {
            window.location.href = "login.html";
          }
        }
      } catch (e) {
        window.location.href = "login.html";
      }
    }
    
    checkResetToken();
    
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      
      if (newPassword !== confirmPassword) {
        showAlert("Passwords do not match");
        return;
      }
      
      if (newPassword.length < 6) {
        showAlert("Password must be at least 6 characters");
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";
      
      try {
        await auth.updatePassword(newPassword);
        resetFormContainer.classList.add("hidden");
        successMessage.classList.remove("hidden");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 3000);
      } catch (error) {
        showAlert(error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>

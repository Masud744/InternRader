name: InternRadar Daily Run

on:
  schedule:
    # Runs at 02:30 UTC every day
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  run-internradar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          JOB_KEYWORDS: ${{ secrets.JOB_KEYWORDS }}
          SEARCH_TERMS: ${{ secrets.SEARCH_TERMS }}
          MAX_RESULTS_PER_SOURCE: ${{ secrets.MAX_RESULTS_PER_SOURCE }}
          SEND_EMPTY_DIGEST: ${{ secrets.SEND_EMPTY_DIGEST }}
          DRY_RUN: "false"
        run: python main.py
